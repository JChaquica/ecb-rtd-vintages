<!doctype html>
<!--
  The page served by code/06_vintage_picker.py: pick variables and vintage dates,
  get one zip of just those files. It needs nothing from the internet; the server
  gives it /catalog.json and takes a selection at /download.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ECB Real Time Database vintages</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f7f9;
    --panel: #ffffff;
    --panel-2: #f1f3f6;
    --ink: #15181d;
    --ink-2: #5a6472;
    --line: #dfe3e9;
    --accent: #0b5aa2;
    --accent-ink: #ffffff;
    --warn-bg: #fdf3e2;
    --warn-ink: #7a4b07;
    --radius: 8px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14171b;
      --panel: #1c2026;
      --panel-2: #23282f;
      --ink: #e8ebef;
      --ink-2: #9aa5b3;
      --line: #313843;
      --accent: #5aa9ef;
      --accent-ink: #0d1116;
      --warn-bg: #352a16;
      --warn-ink: #e8c88a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding-bottom: 92px;
  }
  header {
    padding: 20px 16px 12px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
  }
  .wrap { max-width: 1180px; margin: 0 auto; }
  h1 { margin: 0 0 4px; font-size: 19px; letter-spacing: -0.01em; }
  .sub { color: var(--ink-2); font-size: 13px; }
  .sub code { background: var(--panel-2); padding: 1px 5px; border-radius: 4px; font-size: 12px; }

  .cols { display: grid; grid-template-columns: 1.25fr 1fr; gap: 16px; padding: 16px; max-width: 1180px; margin: 0 auto; }
  @media (max-width: 860px) { .cols { grid-template-columns: 1fr; } body { padding-bottom: 150px; } }

  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); display: flex; flex-direction: column; min-height: 0; }
  .panel > h2 { margin: 0; padding: 12px 14px 10px; font-size: 14px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .panel > h2 span { font-weight: 400; color: var(--ink-2); font-size: 12px; }
  .tools { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 14px; border-bottom: 1px solid var(--line); align-items: center; }
  .scroll { overflow-y: auto; max-height: 56vh; padding: 4px 0; }
  @media (max-width: 860px) { .scroll { max-height: 42vh; } }

  button, select, input[type="search"] {
    font: inherit; color: inherit; background: var(--panel-2);
    border: 1px solid var(--line); border-radius: 6px; padding: 5px 9px;
  }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.link { background: none; border: none; padding: 3px 5px; color: var(--accent); text-decoration: underline; }
  input[type="search"] { flex: 1 1 180px; min-width: 120px; }
  input[type="checkbox"] { accent-color: var(--accent); width: 15px; height: 15px; margin: 0; flex: none; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .group { border-bottom: 1px solid var(--line); }
  .group:last-child { border-bottom: none; }
  .group > .head { display: flex; align-items: center; gap: 9px; padding: 8px 14px; background: var(--panel-2); font-weight: 600; }
  .group > .head .twisty { cursor: pointer; color: var(--ink-2); width: 14px; text-align: center; user-select: none; background: none; border: none; padding: 0; font-size: 11px; }
  .group > .head .name { cursor: pointer; flex: 1; }
  .group > .head .n { color: var(--ink-2); font-weight: 400; font-size: 12px; }
  .item { display: flex; align-items: center; gap: 9px; padding: 5px 14px 5px 34px; }
  .item:hover { background: var(--panel-2); }
  .item label { flex: 1; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; cursor: pointer; }
  .item .meta { color: var(--ink-2); font-size: 12px; }
  .badge { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink-2); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
  .badge.warn { background: var(--warn-bg); color: var(--warn-ink); border-color: transparent; }
  .hidden { display: none; }

  .dates { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 2px 8px; padding: 6px 14px 10px 34px; }
  .date { display: flex; align-items: center; gap: 7px; font-variant-numeric: tabular-nums; }
  .date label { cursor: pointer; border-radius: 4px; padding: 0 3px; }
  /* how the dates stand for the variables that are ticked right now */
  .date.stale label { background: var(--warn-bg); color: var(--warn-ink); }
  .date.gone label { opacity: 0.5; text-decoration: line-through; }
  .legend { padding: 7px 14px; border-bottom: 1px solid var(--line); color: var(--ink-2); font-size: 12px; display: flex; gap: 14px; flex-wrap: wrap; }
  .legend i { font-style: normal; border-radius: 4px; padding: 0 4px; }
  .legend .s { background: var(--warn-bg); color: var(--warn-ink); }
  .legend .g { opacity: 0.5; text-decoration: line-through; }

  footer {
    position: fixed; bottom: 0; left: 0; right: 0; background: var(--panel);
    border-top: 1px solid var(--line); padding: 10px 16px;
  }
  .bar { display: flex; gap: 16px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
  .counts { font-size: 13px; }
  .counts b { font-variant-numeric: tabular-nums; }
  .note { color: var(--ink-2); font-size: 12px; margin-top: 2px; }
  .note.warn { color: var(--warn-ink); background: var(--warn-bg); display: inline-block; padding: 2px 7px; border-radius: 5px; }
  .shapes { display: flex; gap: 14px; flex-wrap: wrap; }
  .shapes label { display: flex; gap: 7px; align-items: center; }
  .go { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; padding: 9px 18px; font-size: 14px; }
  .go[disabled] { opacity: 0.5; cursor: not-allowed; }
  iframe { display: none; }
</style>
</head>
<body>

<header><div class="wrap">
  <h1>Vintages of the ECB Real Time Database, 2001&ndash;2026</h1>
  <div class="sub" id="intro">reading the catalogue&hellip;</div>
</div></header>

<div class="cols">
  <section class="panel">
    <h2>Variables <span id="varCount"></span></h2>
    <div class="tools">
      <input type="search" id="search" placeholder="Search variable, indicator or ECB key" autocomplete="off">
      <button type="button" id="selShown">Select shown</button>
      <button type="button" id="clearVars">Clear</button>
    </div>
    <div class="scroll" id="vars"></div>
  </section>

  <section class="panel">
    <h2>Vintage dates <span id="dateCount"></span></h2>
    <div class="tools">
      <button type="button" data-pick="all">All</button>
      <button type="button" data-pick="latest">Latest</button>
      <button type="button" data-pick="latest12">Latest 12</button>
      <button type="button" data-pick="yearly">One a year</button>
      <button type="button" data-pick="none">Clear</button>
      <label style="display:flex;gap:6px;align-items:center;margin-left:auto">
        <span class="meta">from</span><select id="from"></select>
        <span class="meta">to</span><select id="to"></select>
      </label>
    </div>
    <div class="legend" id="legend">Tick a variable or two and the dates show how it stood on each of them.</div>
    <div class="scroll" id="dates"></div>
  </section>
</div>

<footer><div class="bar">
  <div>
    <div class="counts" id="summary">nothing chosen yet</div>
    <div class="note" id="warning"></div>
  </div>
  <div class="shapes">
    <label><input type="checkbox" id="fmtWorkbooks" checked> Excel workbooks <span class="meta">(one per variable per date)</span></label>
    <label><input type="checkbox" id="fmtTables"> Revision tables <span class="meta">(one CSV per series)</span></label>
  </div>
  <button type="button" class="go" id="go" disabled>Download zip</button>
</div></footer>

<form id="form" method="post" action="/download" target="sink">
  <input type="hidden" name="selection" id="selection">
</form>
<iframe name="sink" id="sink"></iframe>

<script>
"use strict";

let CAT = null;                 // the catalogue from the server
const pickedVars = new Set();   // indices into CAT.variables
const pickedDates = new Set();  // indices into CAT.dates

const $ = (id) => document.getElementById(id);
const fmtBytes = (n) =>
  n >= 1e9 ? (n / 1e9).toFixed(n < 1e10 ? 2 : 1) + " GB"
  : n >= 1e6 ? (n / 1e6).toFixed(n < 1e7 ? 1 : 0) + " MB"
  : n >= 1e3 ? Math.round(n / 1e3) + " kB" : n + " B";
const plural = (n, word) => `${n.toLocaleString()} ${word}${n === 1 ? "" : "s"}`;
const esc = (s) => s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

fetch("catalog.json").then((r) => r.json()).then(start).catch((e) => {
  $("intro").textContent = "could not read the catalogue: " + e;
});

function start(cat) {
  CAT = cat;
  const onDisk = cat.variables.reduce((s, v) => s + v.onDisk, 0);
  const bytes = cat.variables.reduce((s, v) => s + v.xlsxBytes + v.csvBytes, 0);
  const where = `Read from <code>${esc(cat.root)}</code>.`;
  $("intro").innerHTML = (cat.have.workbooks || cat.have.tables)
    ? `${plural(cat.variables.length, "variable")}, ${plural(cat.dates.length, "vintage date")}, `
      + `${plural(onDisk, "workbook")} on this machine (${fmtBytes(bytes)} in all). `
      + `Tick what you need; the server zips just those files. ` + where
    : `<b>The data are not on this machine yet.</b> The repository holds the scripts, not the `
      + `1.4 GB of vintages: run <code>code/01</code> to <code>code/04</code> in order to `
      + `rebuild them, then start this page again. Below is what there will be to choose from: `
      + `${plural(cat.variables.length, "variable")} and ${plural(cat.dates.length, "vintage date")}. `
      + where;

  if (!cat.have.workbooks) { $("fmtWorkbooks").checked = false; $("fmtWorkbooks").disabled = true; $("fmtTables").checked = true; }
  if (!cat.have.tables) { $("fmtTables").disabled = true; }

  drawVariables();
  drawDates();
  pickDates("latest");

  $("search").addEventListener("input", filterVariables);
  $("selShown").addEventListener("click", () => {
    shownVariables().forEach((i) => pickedVars.add(i));
    syncVariables(); update();
  });
  $("clearVars").addEventListener("click", () => { pickedVars.clear(); syncVariables(); update(); });
  document.querySelectorAll("[data-pick]").forEach((b) =>
    b.addEventListener("click", () => pickDates(b.dataset.pick)));
  $("from").addEventListener("change", (e) => limitRange(e.target));
  $("to").addEventListener("change", (e) => limitRange(e.target));
  $("fmtWorkbooks").addEventListener("change", update);
  $("fmtTables").addEventListener("change", update);
  $("go").addEventListener("click", download);
  update();
}

/* ---------- variables, grouped by indicator folder ---------- */

function drawVariables() {
  const byFolder = new Map();
  CAT.variables.forEach((v, i) => {
    if (!byFolder.has(v.Folder)) byFolder.set(v.Folder, []);
    byFolder.get(v.Folder).push(i);
  });

  const host = $("vars");
  for (const [folder, members] of byFolder) {
    const group = document.createElement("div");
    group.className = "group";
    group.dataset.members = members.join(",");

    const head = document.createElement("div");
    head.className = "head";
    const twisty = document.createElement("button");
    twisty.type = "button"; twisty.className = "twisty"; twisty.textContent = "▼";
    twisty.setAttribute("aria-label", "show or hide " + folder);
    const box = document.createElement("input");
    box.type = "checkbox"; box.className = "groupBox";
    box.setAttribute("aria-label", "all of " + folder);
    const name = document.createElement("span");
    name.className = "name"; name.textContent = folder;
    const n = document.createElement("span");
    n.className = "n"; n.textContent = members.length;
    head.append(twisty, box, name, n);

    const body = document.createElement("div");
    members.forEach((i) => body.appendChild(variableRow(i)));

    twisty.addEventListener("click", () => {
      body.classList.toggle("hidden");
      twisty.textContent = body.classList.contains("hidden") ? "▶" : "▼";
    });
    name.addEventListener("click", () => box.click());
    box.addEventListener("change", () => {
      shownIn(group).forEach((i) => box.checked ? pickedVars.add(i) : pickedVars.delete(i));
      syncVariables(); update();
    });

    group.append(head, body);
    host.appendChild(group);
  }
}

function variableRow(i) {
  const v = CAT.variables[i];
  const row = document.createElement("div");
  row.className = "item";
  row.dataset.index = i;
  row.dataset.hay = [v.Variable, v.Folder, v["ECB series key"], v["ECB title"]].join(" ").toLowerCase();

  const box = document.createElement("input");
  box.type = "checkbox"; box.className = "varBox"; box.id = "v" + i;
  box.addEventListener("change", () => {
    box.checked ? pickedVars.add(i) : pickedVars.delete(i);
    syncVariables(); update();
  });

  const label = document.createElement("label");
  label.htmlFor = "v" + i;
  const name = document.createElement("span");
  name.textContent = v.Variable;
  const meta = document.createElement("span");
  meta.className = "meta";
  meta.textContent = `${v.Frequency} · ${v.Unit} · from ${v["First vintage"]}`;
  label.append(name, meta);

  const missing = count(v.avail, "0"), behind = count(v.avail, "2");
  if (behind || missing > leadingZeros(v.avail)) {
    const badge = document.createElement("span");
    badge.className = "badge warn";
    badge.textContent = behind ? `behind in ${behind}` : "has gaps";
    badge.title = "This series is not up to date in some vintages. "
      + "See output/series_gaps.csv in the repository.";
    label.appendChild(badge);
  }

  row.append(box, label);
  return row;
}

const count = (s, ch) => { let n = 0; for (const c of s) if (c === ch) n++; return n; };
const leadingZeros = (s) => s.length - s.replace(/^0+/, "").length;

function filterVariables() {
  const q = $("search").value.trim().toLowerCase();
  document.querySelectorAll("#vars .group").forEach((group) => {
    let shown = 0;
    group.querySelectorAll(".item").forEach((row) => {
      const hit = !q || row.dataset.hay.includes(q);
      row.classList.toggle("hidden", !hit);
      if (hit) shown++;
    });
    group.classList.toggle("hidden", shown === 0);
    group.querySelector(".n").textContent = q ? `${shown} of ${group.dataset.members.split(",").length}` : shown;
  });
  syncVariables();
}

const shownIn = (group) => [...group.querySelectorAll(".item:not(.hidden)")].map((r) => +r.dataset.index);
const shownVariables = () =>
  [...document.querySelectorAll("#vars .group:not(.hidden)")].flatMap(shownIn);

function syncVariables() {
  document.querySelectorAll("#vars .varBox").forEach((box) => {
    box.checked = pickedVars.has(+box.parentElement.dataset.index);
  });
  document.querySelectorAll("#vars .group").forEach((group) => {
    const shown = shownIn(group);
    const on = shown.filter((i) => pickedVars.has(i)).length;
    const box = group.querySelector(".groupBox");
    box.checked = shown.length > 0 && on === shown.length;
    box.indeterminate = on > 0 && on < shown.length;
  });
}

/* ---------- vintage dates, grouped by year ---------- */

function drawDates() {
  const years = new Map();
  CAT.dates.forEach((d, i) => {
    const y = d.slice(0, 4);
    if (!years.has(y)) years.set(y, []);
    years.get(y).push(i);
  });

  const host = $("dates");
  for (const [year, members] of years) {
    const group = document.createElement("div");
    group.className = "group";
    group.dataset.year = year;

    const head = document.createElement("div");
    head.className = "head";
    const box = document.createElement("input");
    box.type = "checkbox"; box.className = "yearBox";
    box.setAttribute("aria-label", "all vintages of " + year);
    const name = document.createElement("span");
    name.className = "name"; name.textContent = year;
    const n = document.createElement("span");
    n.className = "n"; n.textContent = members.length;
    head.append(box, name, n);
    name.addEventListener("click", () => box.click());
    box.addEventListener("change", () => {
      members.forEach((i) => box.checked ? pickedDates.add(i) : pickedDates.delete(i));
      syncDates(); update();
    });

    const grid = document.createElement("div");
    grid.className = "dates";
    members.forEach((i) => {
      const cell = document.createElement("div");
      cell.className = "date";
      const b = document.createElement("input");
      b.type = "checkbox"; b.className = "dateBox"; b.id = "d" + i; b.dataset.index = i;
      b.addEventListener("change", () => {
        b.checked ? pickedDates.add(i) : pickedDates.delete(i);
        syncDates(); update();
      });
      const l = document.createElement("label");
      l.htmlFor = "d" + i;
      l.textContent = CAT.dates[i].slice(5);     // the year is the group's heading
      cell.append(b, l);
      grid.appendChild(cell);
    });

    group.append(head, grid);
    host.appendChild(group);
  }

  for (const sel of [$("from"), $("to")]) {
    CAT.dates.forEach((d, i) => sel.add(new Option(d, i)));
  }
  $("from").value = 0;
  $("to").value = CAT.dates.length - 1;
}

function pickDates(which) {
  const n = CAT.dates.length;
  pickedDates.clear();
  if (which === "all") for (let i = 0; i < n; i++) pickedDates.add(i);
  else if (which === "latest") pickedDates.add(n - 1);
  else if (which === "latest12") for (let i = Math.max(0, n - 12); i < n; i++) pickedDates.add(i);
  else if (which === "yearly") {
    const seen = new Set();
    CAT.dates.forEach((d, i) => {
      const y = d.slice(0, 4);
      if (!seen.has(y)) { seen.add(y); pickedDates.add(i); }
    });
  }
  const chosen = [...pickedDates];
  $("from").value = chosen.length ? Math.min(...chosen) : 0;
  $("to").value = chosen.length ? Math.max(...chosen) : n - 1;
  syncDates(); update();
}

function limitRange(changed) {
  // The two dropdowns choose a run of dates. Dragging one past the other pulls
  // the other with it rather than emptying the selection.
  const from = $("from"), to = $("to");
  if (+from.value > +to.value) (changed === from ? to : from).value = changed.value;
  pickedDates.clear();
  for (let i = +from.value; i <= +to.value; i++) pickedDates.add(i);
  syncDates(); update();
}

function syncDates() {
  document.querySelectorAll("#dates .dateBox").forEach((b) => {
    b.checked = pickedDates.has(+b.dataset.index);
  });
  document.querySelectorAll("#dates .group").forEach((group) => {
    const boxes = [...group.querySelectorAll(".dateBox")];
    const on = boxes.filter((b) => b.checked).length;
    const box = group.querySelector(".yearBox");
    box.checked = on === boxes.length;
    box.indeterminate = on > 0 && on < boxes.length;
  });
}

/* ---------- what the selection comes to ---------- */

function formats() {
  const f = [];
  if ($("fmtWorkbooks").checked) f.push("workbooks");
  if ($("fmtTables").checked) f.push("tables");
  return f;
}

function tally() {
  const dates = [...pickedDates];
  let files = 0, bytes = 0, behind = 0, missing = 0;
  const wantBooks = $("fmtWorkbooks").checked, wantTables = $("fmtTables").checked;

  for (const i of pickedVars) {
    const v = CAT.variables[i];
    const each = v.onDisk ? v.xlsxBytes / v.onDisk : 0;
    for (const d of dates) {
      const state = v.avail[d];
      if (state === "0") { missing++; continue; }
      if (state === "2") behind++;
      if (wantBooks) { files++; bytes += each; }
    }
    if (wantTables) {
      files++;
      // the table is cut to the chosen columns, so scale it by their share
      bytes += Math.max(600, v.csvBytes * (dates.length / CAT.dates.length));
    }
  }
  return { files, bytes, behind, missing, dates: dates.length };
}

/* How each date stands for the variables ticked right now: struck through where
   none of them has a file, marked where one of them had fallen behind. The
   repository's series_status_by_vintage.csv is what says so. */
function markDates() {
  const chosen = [...pickedVars];
  let stale = 0, gone = 0;

  document.querySelectorAll("#dates .date").forEach((cell) => {
    const i = +cell.querySelector(".dateBox").dataset.index;
    let have = 0, behind = 0;
    for (const vi of chosen) {
      const state = CAT.variables[vi].avail[i];
      if (state !== "0") have++;
      if (state === "2") behind++;
    }
    const none = chosen.length > 0 && have === 0;
    cell.classList.toggle("gone", none);
    cell.classList.toggle("stale", !none && behind > 0);
    if (none) { gone++; cell.title = "none of the variables ticked has a file for this vintage"; }
    else if (behind) {
      stale++;
      cell.title = behind === chosen.length
        ? "every variable ticked had fallen behind in this vintage"
        : `${behind} of the ${chosen.length} variables ticked had fallen behind in this vintage`;
    } else {
      cell.title = chosen.length ? "every variable ticked is up to date in this vintage" : "";
    }
  });

  $("legend").innerHTML = chosen.length === 0
    ? "Tick a variable or two and the dates show how it stood on each of them."
    : `Of the 261 dates, <i class="s">${stale}</i> are vintages in which something ticked had `
      + `fallen behind and <i class="g">${gone}</i> have no file for anything ticked. `
      + `The zip records which, in not_up_to_date.csv.`;
}

function update() {
  $("varCount").textContent = `${pickedVars.size} of ${CAT.variables.length} chosen`;
  $("dateCount").textContent = `${pickedDates.size} of ${CAT.dates.length} chosen`;
  markDates();

  const t = tally();
  const ready = pickedVars.size > 0 && pickedDates.size > 0 && formats().length > 0 && t.files > 0;
  $("go").disabled = !ready;

  $("summary").innerHTML = pickedVars.size === 0 || pickedDates.size === 0
    ? "nothing chosen yet"
    : `<b>${plural(pickedVars.size, "variable")}</b> × <b>${plural(t.dates, "vintage date")}</b>`
      + ` → <b>${plural(t.files, "file")}</b>, about <b>${fmtBytes(t.bytes)}</b> zipped`;

  const notes = [];
  if (t.missing) notes.push(`${t.missing.toLocaleString()} of the combinations chosen have no file (the series was not yet published, or had no observations) and are skipped`);
  if (t.behind) notes.push(`${t.behind.toLocaleString()} are vintages in which a series had fallen behind — the zip lists them in not_up_to_date.csv`);
  const el = $("warning");
  el.textContent = notes.join("; ");
  el.className = "note" + (t.behind ? " warn" : "");
}

/* ---------- ask the server for the zip ---------- */

function download() {
  const selection = {
    variables: [...pickedVars].sort((a, b) => a - b),
    vintages: [...pickedDates].sort((a, b) => a - b),
    formats: formats(),
  };
  $("selection").value = JSON.stringify(selection);
  $("form").submit();                 // a real form post, so the browser streams it to disk

  const go = $("go"), label = go.textContent;
  go.disabled = true;
  go.textContent = "Building the zip…";
  const t = tally();
  $("warning").className = "note";
  $("warning").textContent = t.files > 2000
    ? "The server is copying the files. A selection this large can take a minute or two; the download starts when it is ready."
    : "The server is copying the files; the download starts in a moment.";
  setTimeout(() => { go.textContent = label; update(); }, 4000);
}

// The download goes to a hidden frame, so the server reports problems this way.
window.addEventListener("message", (e) => {
  if (e.data && e.data.rtdError) {
    const el = $("warning");
    el.className = "note warn";
    el.textContent = "The server could not build the zip: " + e.data.rtdError;
    $("go").textContent = "Download zip";
    $("go").disabled = false;
  }
});
</script>
</body>
</html>
